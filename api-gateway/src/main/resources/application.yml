server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      # Pure path-based routing, nothing else. Each downstream service is
      # already its own JWT resource server (see each service's SecurityConfig
      # and "Authentication" in the README) - validating a token here too
      # would just duplicate that check, not add a real second line of
      # defense, since the gateway and the services all trust the same JWKS.
      routes:
        - id: auth-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/auth/**,/.well-known/**
        - id: account-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/accounts/**
        - id: transaction-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/transfers/**
        - id: notification-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/notifications/**

management:
  endpoints:
    web:
      exposure:
        include: health, info, gateway

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{traceId:-},%X{spanId:-}]"
