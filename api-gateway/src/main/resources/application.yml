server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      # Pure path-based routing, nothing else. Each downstream service is
      # already its own JWT resource server (see each service's SecurityConfig
      # and "Authentication" in the README) - validating a token here too
      # would just duplicate that check, not add a real second line of
      # defense, since the gateway and the services all trust the same JWKS.
      # Host and port are both overridable. Compose sets the hosts; the
      # ports exist so GatewayRoutingTest can point every route at one
      # in-process fake backend. Nothing else ever sets them.
      routes:
        - id: auth-service
          uri: http://${AUTH_SERVICE_HOST:localhost}:${AUTH_SERVICE_PORT:8084}
          predicates:
            - Path=/api/v1/auth/**,/.well-known/**
        - id: account-service
          uri: http://${ACCOUNT_SERVICE_HOST:localhost}:${ACCOUNT_SERVICE_PORT:8081}
          predicates:
            - Path=/api/v1/accounts/**
        - id: transaction-service
          uri: http://${TRANSACTION_SERVICE_HOST:localhost}:${TRANSACTION_SERVICE_PORT:8082}
          predicates:
            - Path=/api/v1/transfers/**
        - id: notification-service
          uri: http://${NOTIFICATION_SERVICE_HOST:localhost}:${NOTIFICATION_SERVICE_PORT:8083}
          predicates:
            - Path=/api/v1/notifications/**

        # These four exist only so the aggregated Swagger UI below can fetch
        # each service's document from this same origin. Without them the
        # browser would have to reach four different ports, which is both a
        # cross-origin problem and the opposite of what a gateway is for.
        - id: auth-service-docs
          uri: http://${AUTH_SERVICE_HOST:localhost}:${AUTH_SERVICE_PORT:8084}
          predicates:
            - Path=/docs/auth-service/v3/api-docs
          filters:
            - RewritePath=/docs/auth-service/v3/api-docs, /v3/api-docs
        - id: account-service-docs
          uri: http://${ACCOUNT_SERVICE_HOST:localhost}:${ACCOUNT_SERVICE_PORT:8081}
          predicates:
            - Path=/docs/account-service/v3/api-docs
          filters:
            - RewritePath=/docs/account-service/v3/api-docs, /v3/api-docs
        - id: transaction-service-docs
          uri: http://${TRANSACTION_SERVICE_HOST:localhost}:${TRANSACTION_SERVICE_PORT:8082}
          predicates:
            - Path=/docs/transaction-service/v3/api-docs
          filters:
            - RewritePath=/docs/transaction-service/v3/api-docs, /v3/api-docs
        - id: notification-service-docs
          uri: http://${NOTIFICATION_SERVICE_HOST:localhost}:${NOTIFICATION_SERVICE_PORT:8083}
          predicates:
            - Path=/docs/notification-service/v3/api-docs
          filters:
            - RewritePath=/docs/notification-service/v3/api-docs, /v3/api-docs

# One Swagger UI at http://localhost:8080/swagger-ui.html, with a dropdown
# for the four services - the same "one door in" the gateway already provides
# for traffic. Start with auth-service in the dropdown (springdoc sorts the
# list alphabetically, so it isn't first): the token from its /login is what
# the other three services' Authorize buttons expect.
springdoc:
  swagger-ui:
    urls:
      - name: auth-service
        url: /docs/auth-service/v3/api-docs
      - name: account-service
        url: /docs/account-service/v3/api-docs
      - name: transaction-service
        url: /docs/transaction-service/v3/api-docs
      - name: notification-service
        url: /docs/notification-service/v3/api-docs

management:
  endpoints:
    web:
      exposure:
        # The gateway sees every request before it fans out, so its
        # metrics are the only place the platform's overall request
        # rate and latency exist in one series.
        include: health, info, gateway, metrics, prometheus

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{traceId:-},%X{spanId:-}]"
