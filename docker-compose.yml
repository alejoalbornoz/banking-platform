name: banking-platform

services:
  postgres:
    image: postgres:16-alpine
    container_name: banking-postgres
    environment:
      POSTGRES_USER: banking
      POSTGRES_PASSWORD: banking
      # account_db exists today; the rest are pre-created so adding a new
      # service later never requires touching this compose file's DB setup.
      POSTGRES_MULTIPLE_DATABASES: account_db,transaction_db,notification_db,auth_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U banking"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: banking-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: banking
      RABBITMQ_DEFAULT_PASS: banking
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # management UI: http://localhost:15672
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  zipkin:
    image: openzipkin/zipkin:latest
    container_name: banking-zipkin
    ports:
      - "9411:9411" # UI: http://localhost:9411

  # A mail catcher: speaks real SMTP, delivers nothing, and shows every
  # message it swallowed at http://localhost:8025. The password-reset flow
  # needs somewhere to send a token, and the alternative for a project with
  # no mail provider is to log it - which would put an account takeover in a
  # log file, the one place credentials get shipped and retained by default.
  mailpit:
    image: axllent/mailpit:v1.20
    container_name: banking-mailpit
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # UI and API

  # Scrapes every service's /actuator/prometheus and evaluates the alert
  # rules. Depends on nothing: a monitoring system that will not start until
  # the things it monitors are healthy is useless exactly when it is needed,
  # so this comes up on its own and reports the others as down until they
  # arrive.
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: banking-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      # Short retention: this is a demo, and the alerts here evaluate over
      # minutes rather than weeks.
      - --storage.tsdb.retention.time=24h
    volumes:
      - ./prometheus:/etc/prometheus:ro
    ports:
      - "9090:9090" # UI: http://localhost:9090, alerts at /alerts

  # The five services below all build from the same root Dockerfile, picking
  # their jar with the MODULE arg - see that file for why one shared build
  # stage is cheaper than five.
  #
  # Each service's application.yml defaults every host to localhost, so
  # running them straight from Maven still works untouched; the variables
  # here are only what changes when they're on Compose's network and have to
  # find each other by service name instead.
  auth-service:
    build:
      context: .
      args:
        MODULE: auth-service
    container_name: banking-auth-service
    environment: &infra-hosts
      POSTGRES_HOST: postgres
      RABBITMQ_HOST: rabbitmq
      ZIPKIN_HOST: zipkin
      AUTH_SERVICE_HOST: auth-service
      ACCOUNT_SERVICE_HOST: account-service
      TRANSACTION_SERVICE_HOST: transaction-service
      NOTIFICATION_SERVICE_HOST: notification-service
      # Only auth-service sends mail, but the anchor is shared by all
      # five and an unused variable costs nothing.
      MAIL_HOST: mailpit
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Busybox wget, which the alpine JRE base image has; it has no curl.
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8084/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  account-service:
    build:
      context: .
      args:
        MODULE: account-service
    container_name: banking-account-service
    environment: *infra-hosts
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  transaction-service:
    build:
      context: .
      args:
        MODULE: transaction-service
    container_name: banking-transaction-service
    environment: *infra-hosts
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8082/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  notification-service:
    build:
      context: .
      args:
        MODULE: notification-service
    container_name: banking-notification-service
    environment: *infra-hosts
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8083/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  api-gateway:
    build:
      context: .
      args:
        MODULE: api-gateway
    container_name: banking-api-gateway
    environment: *infra-hosts
    ports:
      - "8080:8080"
    depends_on:
      auth-service:
        condition: service_healthy
      account-service:
        condition: service_healthy
      transaction-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  postgres-data:
