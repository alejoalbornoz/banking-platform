server:
  port: 8082

spring:
  application:
    name: transaction-service

  datasource:
    url: jdbc:postgresql://localhost:5432/transaction_db
    username: banking
    password: banking
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  rabbitmq:
    host: localhost
    port: 5672
    username: banking
    password: banking

  tracing:
    sampling:
      probability: 1.0

services:
  account-service:
    base-url: http://localhost:8081

banking:
  rabbitmq:
    exchange: banking.events
  outbox:
    relay-interval-ms: 2000

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  tracing:
    enabled: true
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{traceId:-},%X{spanId:-}]"
