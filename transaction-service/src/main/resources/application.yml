server:
  port: 8082

spring:
  application:
    name: transaction-service

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:5432/transaction_db
    username: banking
    password: banking
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: banking
    password: banking

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://${AUTH_SERVICE_HOST:localhost}:8084/.well-known/jwks.json

services:
  account-service:
    base-url: http://${ACCOUNT_SERVICE_HOST:localhost}:8081
  auth-service:
    base-url: http://${AUTH_SERVICE_HOST:localhost}:8084
    # Matches the entry auth-service's banking.security.service-clients
    # config registers for this exact client-id - see auth-service's
    # application.yml.
    client-id: transaction-service
    client-secret: change-me-transaction-service-secret

banking:
  rabbitmq:
    exchange: banking.events
  outbox:
    relay-interval-ms: 2000
    # Attempts before an event is parked as undeliverable. Only
    # failures about the message itself count - a broker outage does
    # not, or a fifteen-minute outage would burn this budget in half a
    # minute and dead-letter the entire backlog. Ten is generous
    # because the cost of giving up too early (a committed state change
    # nobody downstream ever hears about) is far worse than the cost of
    # trying a few more times.
    max-publish-attempts: 10

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  tracing:
    enabled: true
    # Sample every trace while the system is small; dial this down (e.g. 0.1)
    # before this ever resembles production traffic.
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://${ZIPKIN_HOST:localhost}:9411/api/v2/spans

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{traceId:-},%X{spanId:-}]"
