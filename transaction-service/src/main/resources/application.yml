server:
  port: 8082

spring:
  application:
    name: transaction-service

  datasource:
    url: jdbc:postgresql://localhost:5432/transaction_db
    username: banking
    password: banking
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  rabbitmq:
    host: localhost
    port: 5672
    username: banking
    password: banking

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8084/.well-known/jwks.json

services:
  account-service:
    base-url: http://localhost:8081
  auth-service:
    base-url: http://localhost:8084
    # Matches the entry auth-service's banking.security.service-clients
    # config registers for this exact client-id - see auth-service's
    # application.yml.
    client-id: transaction-service
    client-secret: change-me-transaction-service-secret

banking:
  rabbitmq:
    exchange: banking.events
  outbox:
    relay-interval-ms: 2000

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  tracing:
    enabled: true
    # Sample every trace while the system is small; dial this down (e.g. 0.1)
    # before this ever resembles production traffic.
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{traceId:-},%X{spanId:-}]"
