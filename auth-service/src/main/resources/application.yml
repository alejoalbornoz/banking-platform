server:
  port: 8084

spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:5432/auth_db
    username: banking
    password: banking
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate must never auto-generate DDL.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

banking:
  jwt:
    # Tokens a human logs in with. Fifteen minutes, and that is only viable
    # because refresh tokens exist now: an access token is a bearer credential
    # that nothing can revoke - every service validates it offline against the
    # JWK set and never asks us about it - so the only thing bounding a leaked
    # one is how soon it expires. The session's actual length is the refresh
    # token's, below, and that one IS revocable.
    user-token-ttl-seconds: 900
    # Tokens held by trusted internal processes (transaction-service calling
    # account-service's /credit and /debit, notification-service calling
    # account-service's /accounts/{id} to check ownership). Longer-lived than
    # a user token since it's not carried around by a browser - fewer
    # re-issuances to worry about.
    service-token-ttl-seconds: 43200
    # How long a session can be kept alive by refreshing. Long, because this
    # is the credential that can actually be taken away: it lives in the
    # database, every exchange rotates it, and revoking its family ends the
    # session immediately.
    refresh-token-ttl-seconds: 2592000   # 30 days
    # Rotation writes a row per refresh, so RefreshTokenCleanup deletes the
    # long-expired ones. Kept a week past expiry on purpose - a reuse attempt
    # against a just-expired token should read as expired in the logs, not as
    # a token that never existed.
    refresh-token-retention-after-expiry-seconds: 604800   # 7 days
    refresh-token-cleanup-interval-ms: 3600000             # hourly
  security:
    # Service-to-service credentials, not user accounts - deliberately kept
    # out of the `users` table. Real deployments would pull secrets like this
    # from a vault, not plain YAML; this is a portfolio project's version of
    # "not hardcoded in the source that does the checking."
    service-clients:
      transaction-service: change-me-transaction-service-secret
      notification-service: change-me-notification-service-secret

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  tracing:
    enabled: true
    # Sample every trace while the system is small; dial this down (e.g. 0.1)
    # before this ever resembles production traffic.
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://${ZIPKIN_HOST:localhost}:9411/api/v2/spans

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{traceId:-},%X{spanId:-}]"
